<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     width="780" role="img"
     aria-label="A Keithley 6221 current source connects to the outer pair of
     contacts on a sample. The inner pair connects to the A and B inputs of an
     SR830 lock-in amplifier. A dashed line carries the phase marker output of
     the 6221 to the reference input of the lock-in.">
  <defs>
    <marker id="ref-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
     font-size="13" fill="#e6edf3"
     stroke="#9198a1" stroke-width="2" stroke-linecap="square">

    <!-- wiring, drawn first so the boxes sit on top of the ends -->
    <polyline points="230,245 290,245 290,275 330,275" fill="none"/>
    <polyline points="230,280 262,280 262,355 512,355 512,275 470,275"
              fill="none"/>
    <polyline points="366,250 366,182 562,182 562,152" fill="none"/>
    <polyline points="434,250 434,205 612,205 612,152" fill="none"/>
    <polyline points="136,312 136,402 682,402 682,152" fill="none"
              stroke="#4493f8" stroke-dasharray="7 5"
              marker-end="url(#ref-arrow)"/>

    <!-- terminals -->
    <g fill="#9198a1" stroke="none">
      <circle cx="230" cy="245" r="3.5"/><circle cx="230" cy="280" r="3.5"/>
      <circle cx="366" cy="250" r="3.5"/><circle cx="434" cy="250" r="3.5"/>
      <circle cx="562" cy="152" r="3.5"/><circle cx="612" cy="152" r="3.5"/>
    </g>
    <circle cx="682" cy="152" r="3.5" fill="#4493f8" stroke="none"/>
    <circle cx="136" cy="312" r="3.5" fill="#4493f8" stroke="none"/>

    <!-- instruments -->
    <rect x="40" y="202" width="190" height="110" rx="4"
          fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
    <text x="135" y="242" text-anchor="middle" font-size="14"
          font-weight="600" stroke="none">Keithley 6221</text>
    <text x="135" y="262" text-anchor="middle" font-size="12"
          fill="#9198a1" stroke="none">current source</text>

    <rect x="520" y="42" width="220" height="110" rx="4"
          fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
    <text x="630" y="82" text-anchor="middle" font-size="14"
          font-weight="600" stroke="none">SR830</text>
    <text x="630" y="102" text-anchor="middle" font-size="12"
          fill="#9198a1" stroke="none">lock-in amplifier</text>

    <rect x="330" y="250" width="140" height="50" rx="3"
          fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
    <text x="400" y="281" text-anchor="middle" font-size="13"
          stroke="none">sample</text>

    <!-- labels -->
    <g fill="#9198a1" font-size="11" stroke="none">
      <text x="238" y="241">HI</text>
      <text x="238" y="296">LO</text>
      <text x="300" y="266">I+</text>
      <text x="478" y="266">I&#8722;</text>
      <text x="344" y="175">V+</text>
      <text x="442" y="198">V&#8722;</text>
      <text x="550" y="176">A</text>
      <text x="600" y="176">B</text>
    </g>
    <text x="694" y="176" fill="#4493f8" font-size="11"
          stroke="none">REF IN</text>
    <text x="400" y="397" fill="#4493f8" font-size="12"
          stroke="none" text-anchor="middle">phase marker out</text>
  </g>
</svg>
